<script>

const Q=`Which tool takes photos of the Earth from above?|Satellites|GPR|Magnetometer|Rover C4

const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.domElement.style.cssText="position:fixed;left:0;top:0";document.body.prepend(R.domElement);

sc.add(new THREE.HemisphereLight(0xbcd7ff,0x223355,1.1));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,10,4);sc.add(dl);
const gc=document.createElement("canvas");gc.width=gc.height=128;const g=gc.getContext("2d");g.fillStyle="#1d2b5e";g.fillRect(0,0,128,128);g.strokeStyle="#38bdf8";g.lineWidth=4;g.strokeRect(0,0,128,128);
const gt=new THREE.CanvasTexture(gc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(40,40);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshLambertMaterial({map:gt}));fl.rotation.x=-Math.PI/2;sc.add(fl);
for(let i=0;i<28;i++){const a=i/28*6.283,h=5+Math.random()*10,c=new THREE.Color().setHSL(Math.random(),.7,.5);const m=new THREE.Mesh(new THREE.BoxGeometry(2.4,h,2.4),new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:.3}));m.position.set(Math.sin(a)*40,h/2,Math.cos(a)*40);sc.add(m)}
const sp=[];for(let i=0;i<300;i++){const a=Math.random()*6.283,b=Math.random()*1.3+.1;sp.push(Math.sin(a)*Math.cos(b)*100,Math.sin(b)*100,Math.cos(a)*Math.cos(b)*100)}
const sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.Float32BufferAttribute(sp,3));sc.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.4,fog:false})));
// gun
const gun=new THREE.Group(),gm=new THREE.MeshLambertMaterial({color:W[0].c});
const b2=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.38,10),new THREE.MeshLambertMaterial({color:0x334155}));b2.rotation.x=Math.PI/2;b2.position.z=-.4;
const b3=new THREE.Mesh(new THREE.BoxGeometry(.1,.2,.12),gm);b3.position.set(0,-.14,.12);
gun.add(new THREE.Mesh(new THREE.BoxGeometry(.12,.14,.55),gm),b2,b3);gun.position.set(.28,-.25,-.55);cam.add(gun);
const mz=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xffffaa}));mz.position.z=-.62;mz.visible=false;gun.add(mz);
// ---- enemies
const PAL=[0xef4444,0x22c55e,0x3b82f6,0xf59e0b];
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+r,b,r);x.closePath()}
function label(t,col){const c=document.createElement("canvas");c.width=512;c.height=170;const x=c.getContext("2d");x.fillStyle="#fff";rr(x,6,6,500,158,28);x.fill();x.lineWidth=10;x.strokeStyle=col;x.stroke();x.fillStyle="#0f172a";x.textAlign="center";x.textBaseline="middle";
let ln=[t];if(t.length>14){const w=t.split(" ");let a="",i=0;while(i<w.length&&(a+" "+w[i]).trim().length<=Math.ceil(t.length/2)+2){a=(a+" "+w[i]).trim();i++}if(!a){a=w[0];i=1}ln=[a,w.slice(i).join(" ")]}
let fs=ln.length>1?50:68;const F=()=>x.font="800 "+fs+"px Cairo,Arial,sans-serif";F();while(fs>20&&Math.max(...ln.map(s=>x.measureText(s).width))>470){fs-=3;F()}
ln.forEach((s,i)=>x.fillText(s,256,85+(i-(ln.length-1)/2)*(fs+6)));
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true,fog:false}));s.scale.set(3.6,1.2,1);s.renderOrder=5;return s}
function mk(ans,ok,i){const e=new THREE.Group(),col=PAL[i%4],mat=new THREE.MeshLambertMaterial({color:col,emissive:col,emissiveIntensity:.25});
const b=new THREE.Mesh(new THREE.SphereGeometry(.8,16,12),mat);b.position.y=1;e.add(b);
const wh=new THREE.MeshBasicMaterial({color:0xffffff}),bk=new THREE.MeshBasicMaterial({color:0x111111}),yl=new THREE.MeshBasicMaterial({color:0xfde047});
[-.3,.3].forEach(s=>{const a=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),wh);a.position.set(s,1.2,.62);const p=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),bk);p.position.set(s,1.2,.8);
const n=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.6),mat);n.position.set(s,2,0);n.rotation.z=-s;const t=new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),yl);t.position.set(s*1.5,2.3,0);e.add(a,p,n,t)});
const lb=label(ans,"#"+col.toString(16).padStart(6,"0"));lb.position.y=3.4;e.add(lb);e.userData={ok,ph:Math.random()*6};return e}
// ---- fx
const pg=new THREE.BoxGeometry(.2,.2,.2),fx=[];
function boom(e,col){const p=e.position;for(let i=0;i<16;i++){const m=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:col}));m.position.set(p.x,1.5,p.z);sc.add(m);fx.push({m,v:new V((Math.random()-.5)*9,Math.random()*7,(Math.random()-.5)*9),l:.9})}sc.remove(e);ens=ens.filter(x=>x!==e)}
function toast(t,c){const m=$("msg");m.textContent=t;m.style.color=c||"#fff";m.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.opacity=0,1800)}
function hud(){$("hp").textContent="❤️".repeat(Math.max(0,lives));$("cn").textContent=coins;$("sc").textContent=score;$("pg").textContent=Math.min(qi,TOTAL)+"/"+TOTAL;$("wp").textContent="🔫 "+W[wi].n}
// ---- game flow
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){deck=shuf(Q).slice(0,TOTAL);wi=0;own=[1,0,0,0];gm.color.setHex(W[0].c);lives=3;coins=0;score=0;correct=0;streak=0;qi=0;pos.set(0,1.6,0);ens.forEach(e=>sc.remove(e));ens=[];["st","sh","en"].forEach(i=>$(i).classList.remove("on"));S="play";nextQ()}
function nextQ(){if(qi>=TOTAL)return end();cur=deck[qi++];lock=false;tq=performance.now();$("q").textContent=cur.q;hud();
const o=shuf([cur.ok,...cur.w]).slice(0,4);if(!o.includes(cur.ok))o[0]=cur.ok;const a0=yaw+Math.PI,n=o.length;
o.forEach((t,i)=>{const e=mk(t,t===cur.ok,i),a=a0+(i-(n-1)/2)*.55,r=20+Math.random()*3;e.position.set(pos.x+Math.sin(a)*r,0,pos.z+Math.cos(a)*r);sc.add(e);ens.push(e)})}
function after(){lock=true;qi%5===0&&qi<TOTAL&&lives>0?setTimeout(shop,1500):setTimeout(lives>0?nextQ:end,lives>0?1500:1700)}
function wrong(why){lives--;streak=0;$("flash").style.opacity=.55;setTimeout(()=>$("flash").style.opacity=0,200);shake=.5;snd(150,.4,"sawtooth");toast(why+" الصح: "+cur.ok,"#fca5a5");ens.slice().forEach(e=>boom(e,e.userData.ok?0xfde047:0x94a3b8));hud();after()}
function hit(e){if(lock)return;lock=true;if(e.userData.ok){streak++;correct++;const t=(performance.now()-tq)/1e3,gain=10+Math.max(0,Math.round(10-t*.7))+Math.min(streak,5)*2;coins+=gain;score+=gain*10;boom(e,0x22c55e);ens.slice().forEach(x=>boom(x,0x94a3b8));snd(660,.25,"triangle");setTimeout(()=>snd(990,.25,"triangle"),130);toast("✅ برافو! +"+gain+" 🪙","#86efac");hud();after()}else{boom(e,0xef4444);wrong("❌ غلط!")}}
function fire(){if(S!=="play"||cd>0)return;cd=W[wi].cd;snd(520,.15);rec=.12;mt=.05;mz.visible=true;if(lock)return;
const d=new V();cam.getWorldDirection(d);let best=null,bt=1e9;
ens.forEach(e=>{const v=new V(e.position.x-pos.x,1.8-pos.y,e.position.z-pos.z),t=v.dot(d);if(t<0)return;if(v.sub(d.clone().multiplyScalar(t)).length()<W[wi].r&&t<bt){best=e;bt=t}});

function shop(){S="shop";$("sc2").textContent=coins;const el=$("items");el.innerHTML="";
W.forEach((w,i)=>{if(!i)return;const d=document.createElement("div");d.className="it";const b=document.createElement("button");
if(own[i]){b.textContent=wi===i?"متجهّز ✔":"جهّز";b.disabled=wi===i;b.onclick=()=>{wi=i;gm.color.setHex(w.c);hud();shop()}}else{b.textContent=w.p+" 🪙";b.disabled=coins<w.p;b.onclick=()=>{coins-=w.p;own[i]=1;wi=i;gm.color.setHex(w.c);hud();shop()}}
d.innerHTML="<span>"+w.n+" (ضرب أسرع وأوسع)</span>";d.appendChild(b);el.appendChild(d)});
const d=document.createElement("div");d.className="it";d.innerHTML="<span>❤️ قلب إضافي</span>";const b=document.createElement("button");b.textContent="40 🪙";b.disabled=coins<40||lives>=5;b.onclick=()=>{coins-=40;lives++;hud();shop()};d.appendChild(b);el.appendChild(d);$("sh").classList.add("on")}
function end(){S="over";ens.forEach(e=>sc.remove(e));ens=[];const fin=score+Math.max(0,lives)*50,st=correct/TOTAL>=.85?3:correct/TOTAL>=.6?2:correct/TOTAL>=.35?1:0,nm=$("nm").value.trim();
$("et").textContent=lives>0?"🏆 كسبت الحرب!":"💥 خلصت القلوب!";$("es").innerHTML="الإجابات الصح: <b>"+correct+"/"+TOTAL+"</b><br>السكور: <b>"+fin+"</b><br>"+(st?"⭐".repeat(st):"حاول تاني يا بطل!");
const msg="🎮 نتيجة لعبة ICT (الصف الرابع – المحور الأول)\nالاسم: "+nm+"\nالسكور: "+fin+"\nالإجابات الصح: "+correct+"/"+TOTAL+"\nالنجوم: "+(st?"⭐".repeat(st):"0");
